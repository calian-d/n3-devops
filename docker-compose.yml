services:
  # ===========================================
  # GITEA - Servidor Git Open Source
  # ===========================================
  gitea:
    image: gitea/gitea:1.21
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=222
    restart: always
    networks:
      - devops-network
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"  # HTTP
      - "222:22"     # SSH
    depends_on:
      - gitea-setup

  # Serviço auxiliar para setup inicial do Gitea
  gitea-setup:
    image: gitea/gitea:1.21
    container_name: gitea-setup
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - gitea-data:/data
    entrypoint: |
      sh -c "
        if [ ! -f /data/gitea/gitea.db ]; then
          echo 'Inicializando Gitea...'
          mkdir -p /data/gitea
          chown -R 1000:1000 /data
        fi
        echo 'Setup do Gitea concluído'
      "

  # ===========================================
  # DRONE SERVER - CI/CD Server
  # ===========================================
  drone-server:
    image: drone/drone:2
    container_name: drone-server
    environment:
      - DRONE_GITEA_SERVER=http://gitea:3000
      - DRONE_GITEA_CLIENT_ID=drone
      - DRONE_GITEA_CLIENT_SECRET=drone-secret
      - DRONE_RPC_SECRET=drone-rpc-secret-key-2024
      - DRONE_SERVER_HOST=localhost:3002
      - DRONE_SERVER_PROTO=http
      - DRONE_USER_CREATE=username:gitea,admin:true
      - DRONE_LOGS_PRETTY=true
      - DRONE_LOGS_COLOR=true
    restart: always
    networks:
      - devops-network
    volumes:
      - drone-data:/data
    ports:
      - "3002:80"
    depends_on:
      - gitea

  # ===========================================
  # DRONE RUNNER - CI/CD Executor
  # ===========================================
  drone-runner:
    image: drone/drone-runner-docker:1
    container_name: drone-runner
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone-server:80
      - DRONE_RPC_SECRET=drone-rpc-secret-key-2024
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=docker-runner
    restart: always
    networks:
      - devops-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - drone-server

  # ===========================================
  # DOCKER REGISTRY - Repositório de Imagens
  # ===========================================
  registry:
    image: registry:2
    container_name: docker-registry
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
    restart: always
    networks:
      - devops-network
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "5000:5000"

  # ===========================================
  # REGISTRY UI - Interface Web para o Registry
  # ===========================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=N2 DevOps Registry
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      - NGINX_PROXY_PASS_URL=http://registry:5000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=false
      - CATALOG_ELEMENTS_LIMIT=1000
    restart: always
    networks:
      - devops-network
    ports:
      - "5001:80"
    depends_on:
      - registry

  # ===========================================
  # NOSSA APLICAÇÃO - Para testes locais
  # ===========================================
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: n2-devops-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    networks:
      - devops-network
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ===========================================
# NETWORKS
# ===========================================
networks:
  devops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ===========================================
# VOLUMES
# ===========================================
volumes:
  gitea-data:
    driver: local
  drone-data:
    driver: local
  registry-data:
    driver: local